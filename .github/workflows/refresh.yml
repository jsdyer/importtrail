name: Check Canadian importer editions
on:
  schedule:
    - cron: '47 10 7 * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: importtrail-source-refresh
  cancel-in-progress: false
jobs:
  collect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -r collectors/requirements.txt
      - name: Check Canadian Importers Database editions
        run: python collectors/refresh.py
      - name: Validate publication
        run: |
          python -m unittest discover -s tests -v
          python scripts/build.py
      - name: Save checked sources and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'Update Canadian importer product editions'
            git push origin HEAD:main
          fi
          gh workflow run pages.yml --ref main
